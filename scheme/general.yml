version: "1.0"

scheme: /general
type: dict
meta:
    label: General
content:
-   key: storage
    type: dict
    meta:
        label: Storage
        comment: |
            Data storage locations.
        ui: ana.config.general
        actions:
    content:
    -   key: searchpath
        type: table
        meta:
            label: Search paths
            comment: |
                File storage search path.

                Depending on the computing environment, files may be stored in locations with
                a different root (for example when moving from a Microsoft Windows to a
                Linux workstation). This allows files to be represented as, for example

                    {storage}/rawdata/datafile-01.data

                so that configuration files do not need to be edited for different environments.

                See 'ana.fs.alias' for further information.
        content:
        -   key: location
            type: path
            meta:
                label: Location
                comment: |
                    Local path or remote URL.

                    Supported schemes:
                    - file system path (/path/to/data, C:\path\to\data, or file:/path/to/data)
                    - UNC paths (\\server\share or //server/share)
                    - URLs (e.g. https://server/path)
        -   key: category
            type: category
            meta:
                label: Storage category
                categories:
                -   value: "local"
                    label: "Local"
                -   value: "network"
                    label: "Network"
                -   value: "external"
                    label: "External"
                -   value: "remote"
                    label: "Remote"
                default: local
                comment: |
                    Local storage means storage that is permanently connected to the computing device.

                    Network storage refers to mounted data volumes permanently attached (such as mapped 
                    network drives, NFS, etc.).

                    External storage refers to removable media, such has USB hard disks, SD cards, etc.
                    (mind that this requires a consistent mount point [Linux/Unix] or drive letter 
                    [Windows]).

                    Remote storage may refer to any remotely accessible source, which is supported by ANA.

                    See: ana.fs.category
    -   key: scratch
        type: path
        meta:
            label: Scratch directory
            comment: |
                Local, fast storage for temporary data.
            default: 
                eval: |
                    ana.os.paths('tmpdir')
    -   key: cache
        type: dict
        meta:
            label: Cache
            comment: |
                The "cache" is used to store data for offline use. 

                See 'ana.fs.cache' for further information.
        content:
        -   key: path
            type: path
            meta:
                label: Path
                comment: |
                    Local cache directory.
                default: 
                    eval: |
                        ana.os.paths('cachedir')
        -   key: size
            type: numeric
            meta:
                label: Size
                comment: |
                    Maximum size of the cache directory (GiB).
                default: 256
